# Publica una versión nueva: al subir una etiqueta vX.Y.Z compila el instalador de Windows (con
# actualizaciones automáticas) y el APK de Android, y los sube a GitHub Releases.
# La web no pasa por aquí: Amplify la despliega sola con cada push a main.
name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Crear el release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con package.json ($V)"; exit 1; }
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Ruta SAA-C03 $GITHUB_REF_NAME" --generate-notes

  windows:
    name: Instalador de Windows
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:cloud
      - run: npx electron-builder --win nsis portable --publish never
      - name: Subir a GitHub Releases (latest.yml al final)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/Ruta-SAA-C03-Setup-*.exe release/Ruta-SAA-C03-Setup-*.exe.blockmap release/Ruta-SAA-C03-portable.exe --clobber
          gh release upload "$GITHUB_REF_NAME" release/latest.yml --clobber

  android:
    name: APK de Android
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build:web
      - run: npx cap sync android
      - name: Llave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Compilar APK firmado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Subir a GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Ruta-SAA-C03.apk
          gh release upload "$GITHUB_REF_NAME" Ruta-SAA-C03.apk --clobber

version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22 && nvm use 22
        - ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use 22
        - npm run build:web
  artifacts:
    baseDirectory: www
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
